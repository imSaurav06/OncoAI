version: '3.8'

services:
  api:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile
    container_name: oncoai_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=OncoAI Chemistry & Bioactivity Data Platform
      - ENVIRONMENT=production
      - API_V1_STR=/v1
      - DATABASE_URL=postgresql+asyncpg://oncoai_user:oncoai_password@postgres:5432/oncoai_db
      - REDIS_URL=redis://redis:6379/0
      - OBJECT_STORE_PROVIDER=s3
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET_NAME=oncoai-lake
      - AUTH_SECRET_KEY=oncoai_production_secret_key_change_me
      - RDKIT_VERSION=2024.03.5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - ../../data/storage:/app/data/storage

  postgres:
    image: postgres:16-alpine
    container_name: oncoai_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=oncoai_user
      - POSTGRES_PASSWORD=oncoai_password
      - POSTGRES_DB=oncoai_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oncoai_user -d oncoai_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: oncoai_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-03-30T09-41-56Z
    container_name: oncoai_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
