name: OncoAI CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-benchmark:
    name: Test & Performance Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxrender1 libxext6

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply Database Migrations (Alembic)
        run: |
          alembic upgrade head

      - name: Run Test Suite (pytest)
        run: |
          pytest -v

      - name: Seed Reference Oncology Data
        run: |
          python scripts/seed_oncology_data.py

      - name: Run Performance Benchmark Suite
        run: |
          python scripts/run_benchmarks.py
