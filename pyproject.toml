[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oncoai-data-platform"
version = "1.0.0"
description = "Scalable Oncology Chemistry & Bioactivity Data Platform — Production Foundation v1"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rdkit==2024.3.5",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    "pyarrow>=16.0.0",
    "duckdb>=1.0.0",
    "numpy>=1.26.0,<2.1.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
